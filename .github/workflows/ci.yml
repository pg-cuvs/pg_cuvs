name: CI

on:
  push:
    branches: [main, "pr/**", "design/**"]
  pull_request:
    branches: [main]

# ── Job 1: CPU-only unit tests ────────────────────────────────────────────
# Runs on standard GitHub-hosted runners. No CUDA, no GPU, no daemon, no PG.
# Validates: the pure-C unit suites (cuvs_util.c + cuvs_build_corpus.c helpers).
#
# This job used to also run `gcc -fsyntax-only` over three sources, which
# required installing PostgreSQL solely to obtain `pg_config --cflags`. That
# check was a strict subset of tier1-shim below (which compiles AND links the
# whole tree), and its file list had gone stale — src/pg_cuvs_compaction.c is in
# OBJS but was never checked. Both it and the PG install are gone; `make
# test-unit` uses plain $(CC) and never touches PGXS, so an absent pg_config
# just makes `include $(PGXS)` a no-op. Coverage is unchanged: this job remains
# the only place test-unit runs.
jobs:
  build-check:
    name: Unit tests (CPU)
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      # gcc + make are preinstalled on ubuntu-22.04 runners; no apt step needed.
      - name: Documentation contract checks
        run: make docs-contract-check

      - name: Unit tests (CPU-only, no PG/CUDA required)
        run: make test-unit

# ── Job 1b: Tier 1 — CPU-reference shim (full build + installcheck) ────────
# Builds the extension + daemon with the pure-C CPU shim (PGCUVS_CPU_SHIM=1, no
# CUDA/cuVS), runs the real PostgreSQL regression suite against a shim daemon.
# Catches the bug class that actually bit us this session (IPC drift, search_mode
# labeling, fail-closed rejects, rev-map build, manifest contract, VRAM-budget
# control flow) — all GPU-kernel-independent. Approximate-recall regression and
# real VRAM behavior are Tier 2 only. See design/ci-strategy.md (ADR-067).
  tier1-shim:
    name: Tier 1 — CPU shim (installcheck)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # Two compiles happen below with different flag sets (plain -O2 extension,
      # ASAN -O1 daemon). They get separate CCACHE_DIRs under .ccache/ so their
      # object namespaces never mix; one actions/cache entry carries both. The
      # key is per-commit with a rolling restore-key, so every run restores the
      # previous run's cache and saves a fresh one.
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-tier1-${{ github.sha }}
          restore-keys: |
            ccache-tier1-

      - name: Install PostgreSQL 16 + pgvector
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-16 postgresql-server-dev-16 \
              postgresql-16-pgvector gcc make ccache \
              libcurl4-openssl-dev libssl-dev   # daemon objstore client (curl/ssl)

      - name: Build + install (CPU shim, no CUDA)
        run: |
          export PATH=/usr/lib/postgresql/16/bin:$PATH
          # ccache is engaged via an explicit CC override rather than the
          # /usr/lib/ccache PATH symlinks: the `sudo` install targets below must
          # NOT run through ccache (root would create root-owned files in
          # CCACHE_DIR and the cache-save step would then fail), and leaving CC
          # off those invocations makes that impossible by construction.
          # A command-line CC= also wins over the CC that PGXS sets.

          export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache/ext"
          ccache --max-size=400M >/dev/null
          ccache -z >/dev/null
          make CC="ccache gcc" PGCUVS_CPU_SHIM=1 2>&1 | tee -a /tmp/build.log
          sudo env "PATH=$PATH" make PGCUVS_CPU_SHIM=1 install
          echo "--- ccache stats: extension ---"; ccache -s

          # Daemon built with AddressSanitizer (ADR-070: capture the Bug #3 OOM
          # evict-retry crash backtrace; permanent UAF/overflow coverage). The .so
          # stays non-ASAN (built above) so PostgreSQL loads it normally.
          export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache/asan"
          ccache --max-size=400M >/dev/null
          ccache -z >/dev/null
          make CC="ccache gcc" PGCUVS_CPU_SHIM=1 server \
            EXTRA_SERVER_CFLAGS="-fsanitize=address -fno-omit-frame-pointer -O1" \
            EXTRA_SERVER_LDFLAGS="-fsanitize=address" 2>&1 | tee -a /tmp/build.log
          sudo env "PATH=$PATH" make install-server
          echo "--- ccache stats: daemon (ASAN) ---"; ccache -s

          # Prove the shim .so has no GPU runtime dependency.
          ! ldd pg_cuvs.so | grep -qiE 'libcuvs|libcudart|librmm'

      # Non-blocking. The daemon already builds with -Wall -Wextra (Makefile:115)
      # but the diagnostics are buried in the build log, so nobody tracks the
      # count. This surfaces it as a job summary table. Deliberately NOT -Werror
      # yet: a gcc 11.4 build of the daemon currently emits ~31 warnings, ~27 of
      # them -Wstringop-truncation on intentional truncating strncpy() calls.
      # Promote to -Werror (via EXTRA_SERVER_CFLAGS, no Makefile change needed)
      # once this table reads zero — see issue #111.
      - name: Compiler warning summary (non-blocking)
        if: always()
        continue-on-error: true
        run: |
          n=$(grep -c 'warning:' /tmp/build.log 2>/dev/null || true)
          {
            echo "### Compiler warnings: ${n:-0}"
            echo ""
            echo '```'
            grep 'warning:' /tmp/build.log 2>/dev/null \
              | sed -n 's/.*\[\(-W[^]]*\)\]/\1/p' \
              | sort | uniq -c | sort -rn || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configure PostgreSQL + start shim daemon
        run: |
          # Free port 5432 + the default socket dir from any preinstalled cluster,
          # then create a clean PG16 cluster (runners don't auto-create 16/main).
          sudo systemctl stop postgresql 2>/dev/null || true
          sudo pg_dropcluster 16 main --stop 2>/dev/null || true
          sudo pg_createcluster 16 main -p 5432 -- --auth-local=trust --auth-host=trust
          PGCONF=/etc/postgresql/16/main/postgresql.conf
          echo "shared_preload_libraries = 'pg_cuvs'" | sudo tee -a "$PGCONF"
          echo "cuvs.index_dir = '/tmp/cuvs_indexes'" | sudo tee -a "$PGCONF"
          sudo mkdir -p /tmp/cuvs_indexes && sudo chmod 0777 /tmp/cuvs_indexes
          sudo pg_ctlcluster 16 main start
          sudo -u postgres createuser -s "$USER" || true
          # ASAN: report to the daemon log; detect_leaks off (daemon holds memory
          # by design); abort_on_error so a UAF produces a backtrace, not a hang.
          ASAN_OPTIONS="detect_leaks=0:abort_on_error=1:print_stacktrace=1" \
          /usr/lib/postgresql/16/bin/pg_cuvs_server \
            --socket /tmp/.s.pg_cuvs --index-dir /tmp/cuvs_indexes \
            --max-vram-mb 38000 >/tmp/shim_daemon.log 2>&1 &
          for _ in $(seq 1 30); do [ -S /tmp/.s.pg_cuvs ] && break; sleep 1; done
          chmod 666 /tmp/.s.pg_cuvs
          cat /tmp/shim_daemon.log || true

      - name: Regression suite (Tier-1 subset + isolation)
        run: |
          export PATH=/usr/lib/postgresql/16/bin:$PATH
          # Tier-1 subset: REGRESS minus GPU-graph tests (see Makefile
          # REGRESS_TIER2_ONLY: CAGRA->pgvector HNSW graph export, a real-GPU concern).
          make installcheck-tier1 || { echo "===== regression.diffs ====="; cat test/regression.diffs; false; }
          make installcheck-isolation || { echo "===== isolation diffs ====="; cat test/output_iso/regression.diffs 2>/dev/null; cat test/regression.diffs 2>/dev/null; false; }

      # #124: build_oom/build_multi_oom/build_oom_evict_to_fit/extend_cuda_oom
      # (REGRESS_FAULT, excluded from REGRESS_TIER1 above) call
      # pg_cuvs_inject_{build,extend}_oom(), which reach the daemon's
      # CUVS_OP_INJECT_* opcodes — compiled in only under -DCUVS_TEST_HOOKS
      # (pg_cuvs_server.c), so the production shim daemon started above now
      # rejects them ("unknown op"). `installcheck-fault` builds a separate
      # $(SERVER_TEST_BIN) and runs these 4 against it on its own socket +
      # index dir (see Makefile), so this is a second pass, not a substitute
      # for the one above — both must be green.
      - name: Fault-injection installcheck (CUVS_TEST_HOOKS daemon)
        run: |
          export PATH=/usr/lib/postgresql/16/bin:$PATH
          export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache/fault"
          ccache --max-size=400M >/dev/null
          ccache -z >/dev/null
          make CC="ccache gcc" PGCUVS_CPU_SHIM=1 installcheck-fault \
            || { echo "===== fault regression.diffs ====="; cat test/regression.diffs; \
                 echo "===== fault daemon log ====="; cat /tmp/pg_cuvs_fault_daemon.log 2>/dev/null; false; }
          echo "--- ccache stats: fault daemon ---"; ccache -s

      - name: MAX_INDEXES soft-LRU evict/reload (tiny-cap shim daemon)
        run: |
          export PATH=/usr/lib/postgresql/16/bin:$PATH
          # Dedicated --max-indexes 4 shim daemon: build 10 tenant indexes (> cap),
          # query each, assert no registry-full ERROR + correct rows + evictions>0
          # and reloads>0. Slot-cap eviction is GPU-agnostic, so the shim reproduces
          # #45's soft-LRU churn deterministically. Installed server = shim (no CUDA).
          bash infra/scripts/tests/max-indexes-scale.sh

      # The benchmark harness decides which index a published number describes
      # (ownership keys, reloptions checks, the 3I build-NOTICE parser, --resume
      # row skipping). Until now this job ran no Python at all, so those rules
      # were only ever exercised by hand on the GPU VM. They are pure logic and
      # need neither a database nor cuvs_bench -- bench/cuvs_bench_backend/
      # tests skip themselves when a live PostgreSQL is absent.
      - name: Benchmark harness unit tests (CPU, no DB)
        run: |
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet pytest numpy
          python3 -m pytest bench/cuvs_bench_backend/ -q

      - name: Upload diffs + daemon log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shim-regression-diffs
          path: |
            test/regression.diffs
            test/*.diffs
            /tmp/shim_daemon.log
            /tmp/pg_cuvs_fault_daemon.log
          retention-days: 7

# ── Tier 2 (real A100 regression) lives in .github/workflows/gpu.yml ───────
# Run on demand from the Actions UI ("Run workflow"); a hosted runner starts the
# GPU VM (keyless WIF auth), a self-hosted runner on the VM runs the real
# installcheck, then the VM is stopped. See design/ci-strategy.md + docs/ci-gpu-setup.md.

# ── Compatibility matrix (informational) ──────────────────────────────────
# Component        Tested       Minimum
# PostgreSQL       16.3         16
# pgvector         0.8.x        0.5.0
# NVIDIA CUDA      12.4         12.0
# cuVS / RAPIDS    26.04        24.12
# NVIDIA driver    550.x        525
# GCC              11.4         11
# Ubuntu           22.04        20.04
